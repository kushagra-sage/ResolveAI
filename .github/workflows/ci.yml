name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m bandit -q -r apps/api/src/resolveai
      - run: python -m pip_audit
      - run: mkdir -p artifacts && pip-licenses --format=json --output-file=artifacts/dependency-licenses.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-dependency-licenses
          path: artifacts/dependency-licenses.json
      - run: python -m pytest --cov=resolveai --cov-report=term-missing --cov-fail-under=80
      - run: python scripts/run_eval.py datasets/eval/smoke-v1.json
      - run: python scripts/check_gates.py "$(ls -t artifacts/evaluations/*.json | head -1)"
      - run: python scripts/run_experiment.py datasets/eval/smoke-v1.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  postgres-contract:
    runs-on: ubuntu-latest
    env:
      RESOLVEAI_ENVIRONMENT: local
      RESOLVEAI_DATABASE_URL: postgresql+psycopg://resolveai_app:resolveai_app@localhost:5432/resolveai
      RESOLVEAI_MIGRATION_DATABASE_URL: postgresql+psycopg://resolveai_owner:resolveai_owner@localhost:5432/resolveai
      RESOLVEAI_JWT_ALGORITHM: HS256
      RESOLVEAI_JWT_SECRET: ci-only-resolveai-secret-with-sufficient-length
      RESOLVEAI_JWT_ISSUER: resolveai-ci
      RESOLVEAI_JWT_AUDIENCE: resolveai-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres redis
      - run: python -m alembic -c apps/api/alembic.ini upgrade head
      - run: python -m resolveai.seed
      - run: python scripts/verify_postgres.py --synthetic-rows 1000
      - if: always()
        run: docker compose down -v
